# Builds, tests and releases ghcr.io/majikmate/devcontainer-dev.
# The logic is in the shared workflow of devcontainer-base:
# https://github.com/majikmate/devcontainer-base/blob/main/.github/workflows/devcontainer-image.yml
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Nightly check, two hours after the base image (01:17 UTC): a new base image
  # or a new GitHub CLI release leads to a new release
  schedule:
    - cron: "37 3 * * *"
  # Manual check ("Run workflow"): first brings devcontainer-base up to date
  # (option upstream), then runs the same check as the nightly run
  workflow_dispatch:
    inputs:
      upstream:
        description: First update the base image (run the Release workflow of devcontainer-base and wait for it)
        type: boolean
        default: true
      force:
        description: Release a new version even if no input changed
        type: boolean
        default: false
      bump:
        description: Version step
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# One release at a time; pull requests cancel their older runs
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    uses: majikmate/devcontainer-base/.github/workflows/devcontainer-image.yml@main
    permissions:
      contents: write
      packages: write
      actions: write
    # GitHub App that starts the Release workflow of devcontainer-base (manual chain build)
    secrets:
      app-client-id: ${{ secrets.DEVCONTAINER_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.DEVCONTAINER_APP_PRIVATE_KEY }}
    with:
      # The images that this image builds on (see .devcontainer/Dockerfile)
      upstream-repositories: devcontainer-base
      update-upstream: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream == true }}
      image-title: DevContainer Development Environment
      image-description: Development Dev Container (Debian 13, Go, Node.js LTS, Deno LTS, Prettier, GitHub CLI, Dev Container CLI)
      # Same major version as the base image in .devcontainer/Dockerfile
      major-version: 2
      force: ${{ inputs.force || false }}
      bump: ${{ inputs.bump || 'auto' }}
      smoke-test: |
        set -e
        . /etc/os-release
        echo "debian: ${PRETTY_NAME}"
        test "${VERSION_CODENAME}" = "trixie"
        echo "user: $(whoami)"
        echo "version: node=$(node --version)"
        echo "version: deno=$(deno --version | head -n 1 | cut -d ' ' -f 2)"
        echo "version: go=$(go env GOVERSION | sed 's/^go//')"
        echo "version: prettier=$(prettier --version)"
        echo "version: gh=$(gh --version | head -n 1 | cut -d ' ' -f 3)"
        echo "--- Prettier: standard style and Tailwind CSS class sorting"
        mkdir -p /tmp/smoke && cd /tmp/smoke
        printf '<div class="text-center p-4 flex card"></div>\n' > index.html
        prettier index.html | tee /dev/stderr | grep -F 'class="card flex p-4 text-center"'
